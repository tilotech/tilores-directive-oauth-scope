version: "2"
run:
  modules-download-mode: vendor
  tests: false
linters:
  enable:
    - copyloopvar
    - dogsled
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - nakedret
    - prealloc
    - unconvert
    - unparam
    - whitespace
  settings:
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 20
    nakedret:
      max-func-lines: 30
    unparam:
      check-exported: false
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
